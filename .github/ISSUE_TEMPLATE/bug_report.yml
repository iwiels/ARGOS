name: Bug Report
description: File a bug report to help us improve Argos
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please verify that this bug has not already been reported by searching existing issues.
        **Note:** For security vulnerabilities, please refer to [SECURITY.md](https://github.com/iwiels/argos-auditor/blob/main/SECURITY.md) instead of creating a public issue.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which area or package of Argos is affected?
      options:
        - "packages/desktop (Electron app / IPC / Tray)"
        - "packages/app (SolidJS UI)"
        - "packages/ui (Design System / Components)"
        - "packages/core (Engine / Sessions / Database)"
        - "packages/server (HTTP API routes)"
        - "packages/llm (LLM providers)"
        - "argos-bin (Native Go binaries)"
        - "Build / CI / Packaging"
        - "Documentation"
        - "Other / Unsure"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Argos Desktop
        2. Create workspace '...'
        3. Run agent with command '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Provide details about your environment.
      value: |
        - OS: [e.g. Windows 11, macOS Sequoia, Ubuntu 24.04]
        - Argos Version / Commit: [e.g. 0.1.0 or commit SHA]
        - Node Version: [e.g. 20.x]
        - Bun Version: [e.g. 1.2.x]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any error stack traces, terminal output, or drag & drop screenshots.
      render: shell

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched open and closed issues to ensure this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true
