title = "Argos reviewed scanner fixtures"

[extend]
useDefault = true

[[rules]]
id = "github-pat"

[[rules.allowlists]]
description = "Exact reviewed fixture or public identifier in argos-bin/internal/practicetarget/handler.go"
condition = "AND"
paths = ["(?:^|[\\\\/])argos-bin[\\\\/]internal[\\\\/]practicetarget[\\\\/]handler\\.go$"]
regexes = ["^(?:ghp_0123456789abcdefghijklmnopqrstuvwxyz)$"]

[[rules]]
id = "aws-access-token"

[[rules.allowlists]]
description = "Exact reviewed fixture or public identifier in argos-bin/cmd/web/tools/code_scan_test.go"
condition = "AND"
paths = ["(?:^|[\\\\/])argos-bin[\\\\/]cmd[\\\\/]web[\\\\/]tools[\\\\/]code_scan_test\\.go$"]
regexes = ["^(?:AKIAQWERTYUIOPASDFGH)$"]

[[rules.allowlists]]
description = "Exact reviewed fixture or public identifier in packages/argos/test/llm-proxy.test.ts"
condition = "AND"
paths = ["(?:^|[\\\\/])packages[\\\\/]argos[\\\\/]test[\\\\/]llm-proxy\\.test\\.ts$"]
regexes = ["^(?:AKIA1234567890ABCDEF)$"]

