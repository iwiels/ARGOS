overrides:
  '@argos/sdk>typescript': 5.9.3
  "@ai-sdk/provider-utils@>=4.0.0 <5.0.0": "4.0.62"
  # Crítico: type confusion en deserialización, <=1.5.2. Llega como transitiva
  # de solid-js vía kobalte. https://github.com/advisories/GHSA-mv8w-475r-vwqw
  seroval: ">=1.5.3"
  # Alto: confusión de host vía backslash en la autoridad de la URI.
  fast-uri: ">=3.1.5"
  # Alto: ReDoS. Overrides con rango de origen para no forzar un salto de
  # major en las líneas 3.x/5.x/8.x/9.x que ya están fuera del rango vulnerable.
  "minimatch@>=10.0.0 <10.2.3": ">=10.2.3 <11.0.0"
  "brace-expansion@>=2.0.0 <2.1.4": ">=2.1.4 <3.0.0"
  "brace-expansion@>=4.0.0 <5.0.9": ">=5.0.9 <6.0.0"
  # La línea 5.x de undici (usada por @actions/http-client, solo scripts de
  # CI/release) nunca recibió parche 5.x — las advisories solo listan
  # "patched >=6.23+", así que hay que subirla a la línea 6.x también.
  "undici@>=5.0.0 <6.0.0": ">=6.28.0 <7.0.0"
  "undici@>=6.0.0 <6.28.0": ">=6.28.0 <7.0.0"
  "undici@>=8.0.0 <8.9.0": ">=8.9.0 <9.0.0"
  # Alto: ReDoS en el router de find-my-way (fastify).
  find-my-way: ">=9.6.1"
  # Alto: parsing inseguro de paquetes socket.io.
  socket.io-parser: ">=4.2.7"
  # Alto + moderado: SSRF/bypass de validación de IP.
  ip-address: ">=10.3.1"
  # Resto de advisories moderate/low, todos bump de patch dentro del mismo major.
  # (diff se corrige arriba en el catalog, no hace falta override)
  "@opentelemetry/core": ">=2.8.0"
  tar: ">=7.5.21"
  toml: "5.0.1"
  hono: ">=4.12.34"
  "@hono/node-server": ">=1.19.15"
  # Alto: prototype pollution en la carga de YAML, <4.3.1 (y toda la línea
  # 3.x). gray-matter@4.0.3 (última en npm, sin mantenimiento) todavía llama
  # a safeLoad/safeDump, eliminados en v4 — parcheado vía pnpm patch para usar
  # load/dump (seguros por defecto en v4).
  js-yaml: ">=4.3.1"
